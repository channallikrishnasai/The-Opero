<script>
(function(){
  var HERO='cubic-bezier(.16,1,.3,1)';
  var TYPE='cubic-bezier(.3,.7,.55,1)';
  var UI='cubic-bezier(.3,.7,.55,1)';
  var d=document.documentElement;
  function visible(el){
    if(!el)return false;
    if(getComputedStyle(el).display==='none')return false;
    return true;
  }
  function anim(el,kf,opts){
    if(!visible(el))return null;
    var o={fill:'both'};
    for(var key in opts)o[key]=opts[key];
    try{return el.animate(kf,o);}catch(e){return null;}
  }
  function run(){
    if(d.getAttribute('data-anim')!=='pending')return;
    var tweens=[];
    function push(a){if(a)tweens.push(a);}
    var bust=document.querySelector('.bust');
    push(anim(bust,[{opacity:0,scale:'1.028'},{opacity:1,scale:'1'}],{duration:1250,delay:50,easing:HERO}));
    var logo=document.querySelector('.logo');
    push(anim(logo,[{opacity:0,scale:'.9'},{opacity:1,scale:'1'}],{duration:550,delay:300,easing:UI}));
    var navLinks=document.querySelectorAll('.nav a');
    for(var i=0;i<navLinks.length;i++){
      push(anim(navLinks[i],[{opacity:0,translate:'0 -8rem'},{opacity:1,translate:'0 0'}],{duration:500,delay:380+i*40,easing:UI}));
    }
    var trio=[document.querySelector('.burger'),document.querySelector('.moon'),document.querySelector('.mode')];
    for(var j=0;j<trio.length;j++){
      push(anim(trio[j],[{opacity:0,translate:'0 -8rem'},{opacity:1,translate:'0 0'}],{duration:500,delay:440+j*60,easing:UI}));
    }
    var lns=document.querySelectorAll('.headline .ln');
    for(var k=0;k<lns.length;k++){
      push(anim(lns[k],[{translate:'0 105%'},{translate:'0 0'}],{duration:660,delay:580+k*110,easing:TYPE}));
    }
    var blurb=document.querySelector('.blurb');
    push(anim(blurb,[{opacity:0,translate:'0 12rem'},{opacity:1,translate:'0 0'}],{duration:620,delay:920,easing:UI}));
    var instruments=document.querySelector('.instruments');
    push(anim(instruments,[{opacity:0,translate:'0 12rem'},{opacity:1,translate:'0 0'}],{duration:620,delay:1060,easing:UI}));
    if(!tweens.length){
      clearTimeout(window.__entryGuard);
      d.removeAttribute('data-anim');
      return;
    }
    Promise.all(tweens.map(function(t){return t.finished.catch(function(){});})).then(function(){
      clearTimeout(window.__entryGuard);
      d.setAttribute('data-anim','done');
      tweens.forEach(function(t){try{t.cancel();}catch(e){}});
      requestAnimationFrame(function(){d.removeAttribute('data-anim');});
    });
  }
  var fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  var videoReady=new Promise(function(resolve){
    var v=document.querySelector('.bust-v');
    if(!v){resolve();return;}
    if(v.readyState>=2){resolve();return;}
    v.addEventListener('loadeddata',resolve,{once:true});
    v.addEventListener('error',resolve,{once:true});
  });
  var fired=false;
  function go(){if(fired)return;fired=true;requestAnimationFrame(run);}
  Promise.all([fontsReady,videoReady]).then(go);
  setTimeout(go,400);
})();
(function(){
  var burger=document.querySelector('.burger');
  var nav=document.getElementById('primary-nav');
  if(!burger||!nav)return;
  function setOpen(open){
    if(open)document.documentElement.setAttribute('data-menu','open');
    else document.documentElement.removeAttribute('data-menu');
    burger.setAttribute('aria-expanded',open?'true':'false');
  }
  function isOpen(){return document.documentElement.getAttribute('data-menu')==='open';}
  burger.addEventListener('click',function(e){
    e.stopPropagation();
    setOpen(!isOpen());
  });
  document.addEventListener('click',function(e){
    if(!isOpen())return;
    if(nav.contains(e.target)||burger.contains(e.target))return;
    setOpen(false);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape'||!isOpen())return;
    setOpen(false);
    burger.focus();
  });
  nav.addEventListener('click',function(e){
    if(e.target.closest('a'))setOpen(false);
  });
})();
(function(){
  var v=document.querySelector('.bust-v');
  if(!v)return;
  var SENSITIVITY=0.8;
  var EPSILON=0.04;
  var prevX=null,targetTime=0,seeking=false,requested=-1;
  function duration(){
    var d=v.duration;
    return (isFinite(d)&&d>0)?d:0;
  }
  function pump(){
    if(seeking||Math.abs(targetTime-v.currentTime)<EPSILON)return;
    seeking=true;
    requested=targetTime;
    try{v.currentTime=targetTime;}catch(e){seeking=false;}
  }
  v.addEventListener('seeked',function(){
    seeking=false;
    if(targetTime!==requested)pump();
  });
  function anchor(){
    targetTime=v.currentTime;
    if(!v.currentTime){v.currentTime=0.001;}
  }
  v.pause();
  var reduced=false,hoverFine=false;
  try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  try{hoverFine=matchMedia('(hover: hover) and (pointer: fine)').matches;}catch(e){}
  if(reduced){
    v.addEventListener('loadeddata',anchor,{once:true});
    if(v.readyState>=2)anchor();
    return;
  }
  if(!hoverFine){
    v.addEventListener('canplay',function(){
      var p=v.play();
      if(p&&p.catch)p.catch(function(){});
    },{once:true});
    return;
  }
  v.addEventListener('loadeddata',anchor,{once:true});
  if(v.readyState>=2)anchor();
  window.addEventListener('mousemove',function(e){
    var d=duration();
    if(prevX===null||!d){prevX=e.clientX;return;}
    var delta=prevX-e.clientX;
    prevX=e.clientX;
    if(!delta)return;
    var t=targetTime+(delta/window.innerWidth)*SENSITIVITY*d;
    targetTime=Math.max(0,Math.min(d,t));
    pump();
  },{passive:true});
  document.addEventListener('mouseleave',function(){prevX=null;});
  window.addEventListener('blur',function(){prevX=null;});
  document.addEventListener('visibilitychange',function(){prevX=null;});
})();
</script>
