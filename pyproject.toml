[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opero"
version = "0.1.0"
description = "A native voice-first desktop operator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "The Opero Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PyQt6>=6.6,<7",
    "sounddevice>=0.4,<1",
    "numpy>=1.24,<3",
    "google-genai>=2.8.0,<3",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.40,<2",
    "pyautogui",
    "pyperclip",
    "pygetwindow",
    "pillow>=10,<13",
    "opencv-python>=4.8,<5",
    "mss>=9,<11",
    "psutil>=5.9,<8",
    "send2trash",
    "youtube-transcript-api",
    "python-pptx",
    "openpyxl",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "cryptography>=42,<50",
    "python-multipart>=0.0.9,<1",
    "qrcode[pil]>=7,<9",
    "ddgs>=9,<10",
    "pdfplumber",
    "PyPDF2",
    "python-docx",
    "paho-mqtt",
    "nvidia-ml-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "black>=24.0",
]
voice = [
    "assemblyai>=0.35,<0.36",
]
google = [
    "google-api-python-client",
    "google-auth-oauthlib",
]
smart-home = [
    "tinytuya",
]
windows = [
    "comtypes; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
    "win10toast; sys_platform == 'win32'",
    "pywinauto; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "wmi; sys_platform == 'win32'",
]

[project.scripts]
opero = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "actions*", "memory*", "whatsapp*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
